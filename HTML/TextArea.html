<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Area</title>
</head>
<body>
    <form action="/action">
        <label for="feedback">Please give feedback : </label>
        <textarea name="feedback" id="feedback" placeholder="Type your feedback here" rows="5" cols="50"></textarea>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
