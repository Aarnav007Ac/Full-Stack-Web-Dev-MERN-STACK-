<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Range</title>
</head>
<body>
    <form action="/action">
         <label for="vol">Select Volume</label>
        <input type="range" name="vol" id="vol" min="0" max="100"  step="10" value="10">
       <button type="submit">Submit</button>
    </form>
</body>
</html>
