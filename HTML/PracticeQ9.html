<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Q9</title>
</head>
<body>
    <h3>Registration Form</h3>
    <form action="/action">
        <div>
            <input type="text" placeholder="First Name" id="First Name" name="fname">
            <input type="text" placeholder="Last Name"  id="Last Name" name="Lname">
        </div>
        <div>
            <label for="gender">Please Select Gender</label>
            <select name="gender" id="gender">
                <option>Select an option</option>
                <option value="male">Male</option>
                <option value="fmale">Female</option>
                <option value="NA">Select from above</option>
            </select>
        </div>
        <div>
            Do you agree to all terms of service?
            <input type="checkbox" name="tos_agree" id="tos_agree">
            <label for="tos_agree">Yes, I agree</label>
        </div>
        <button type="submit">Register</button>
    </form>
</body>
</html>
