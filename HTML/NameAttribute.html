<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Attribute</title>
</head>
<body>
    <form action="/action">
        <label for="username">Username</label>
        <input type="text" placeholder="Enter Username" id="username" name="user">
        <br>
        <label for="password">Password : </label>
        <input type="password" placeholder="enter password" id="password" name="pass">
        <br>
        <button type="submit">Submit</button>
    </form>
    <hr> 
    <form action="https://www.youtube.com/results?">
        <label for="youtube">Youtube Search</label>
        <input type="text" placeholder="Search Youtube" id="youtube" name="search_query">
        <button type="submit">Search</button>
    </form>
</body>
</html>
