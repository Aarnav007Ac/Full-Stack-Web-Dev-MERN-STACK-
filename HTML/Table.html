<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <table border="black">
        <caption>Food Menu</caption>
        <!-- Table header  -->
        <thead>
            <tr>
            <th>Item</th>
            <th>Price</th>
            </tr>
        </thead>
        
        <!-- table body  -->
        <tbody>
            <tr>
            <td>Frooti</td>
            <td>10</td>
        </tr>
        <tr>
            <td>Samosa</td>
            <td>30</td>
        </tr>
        <tr>
            <td>Rusk</td>
            <td>40</td>
        </tr>
        </tbody>
        
    </table>
</body>
</html>
