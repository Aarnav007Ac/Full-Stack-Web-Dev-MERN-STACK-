<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <form action="/action">
        <div>
            <input type="radio" name="fruit" id="apple" value="apple">
            <label for="apple">Apple</label>
            <input type="radio" name="fruit" id="mango" value="mango">
            <label for="mango">Mango</label>
            <input type="radio" name="fruit" id="orange" value="orange">
            <label for="orange">Orange</label>
            <br>
            <button type="submit">Submit</button>
        </div>
        <div>
            Choose your Subjects :
            <input type="checkbox" name="sub" id="math" value="math">
            <label for="math">Maths</label>
            <input type="checkbox" name="sub" id="english" value="english">
            <label for="english">English</label>
            <input type="checkbox" name="sub" id="science" value="science">
            <label for="science">Science</label>
        </div>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
