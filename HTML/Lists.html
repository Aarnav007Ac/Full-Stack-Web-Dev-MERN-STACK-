<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists in Html</title>
</head>
<body>
    <ul>
        <li><h1>Want to buy: </h1></li>
        <li>Bread</li>
        <li>Jam</li>
        <li>Butter</li>
    </ul>
    <ol>
        <li><h1>Want to buy: </h1></li>
        <li>Bread</li>
        <li>Jam</li>
        <li>Butter</li>
    </ol>
    <ol type="A">
        <li><h1>Want to buy: </h1></li>
        <li>Bread</li>
        <li>Jam</li>
        <li>Butter</li>
    </ol>
    <ol reversed>
        <li><h1>Want to buy: </h1></li>
        <li>Bread</li>
        <li>Jam</li>
        <li>Butter</li>
    </ol>
</body>
</html>
