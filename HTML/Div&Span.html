<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div & Span Element</title>
</head>
<body>
    <ol>
   <li>
    <a href="www.google.com">Google</a>
    <a href="www.facebook.com">Facebook</a>
    <a href="www.youtube.com">Youtube</a>
    </li>
 <!-- What if we want google and facebook in one line and youtube in another line -->
    <li>
    <div>
         <a href="www.google.com">Google</a>
        <a href="www.facebook.com">Facebook</a>
    </div>
    <a href="www.youtube.com">Youtube</a> <br>
    </li>
    <li>
    <span>
         <a href="www.google.com">Google</a>
        <a href="www.facebook.com">Facebook</a>
        </span>
    <a href="www.youtube.com">Youtube</a>
    </li>
    </ol>
</body>
</html>
