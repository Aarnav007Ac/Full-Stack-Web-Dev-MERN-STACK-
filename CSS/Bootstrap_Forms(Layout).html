<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms(Layout)</title>
    <!-- Now we have to link Bootstrap CSS File  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Bootstrap_Forms(Layout).css" />
  </head>
  <body>
    <div class="container">
      <h2>Form Demo</h2>
      <form>
        <div class="row">
          <div class="mb-3 col-md-6 ">
          <label for="email" class="form-label">Email</label>
          <input type="text" class="form-control bg-success" placeholder="Email" id="email" />
        </div>
        <div class="mb-3 col-md-6">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control bg-danger" placeholder="Password" id="password" />
        </div>
        </div>
        
        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <input type="text" class="form-control-lg" placeholder="Address" id="address" />
        </div>
        <div class="mb-3 form-check">
          <input type="checkbox" id="agree" class="form-check-input" />
          <label for="agree" class="form-check-label">Agree</label>
        </div>
        <div class="mb-3 form-check">
          <input type="radio" id="yes" class="form-check-input" />
          <label for="yes" class="form-check-label">Yes</label>
        </div>
        <div class="mb-3 form-check form-switch">
          <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault" />
          <label class="form-check-label" for="switchCheckDefault"
            >Default switch checkbox input</label
          >
        </div>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- This was done to add the bootstrap java script file -->
  </body>
</html>
