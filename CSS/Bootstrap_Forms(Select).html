<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms(Select)</title>
    <!-- Now we have to link Bootstrap CSS File  -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="Bootstrap_Forms(Select).css" />
  </head>
  <body>
    <div class="container">
      <h2>Form Demo</h2>
      <form>
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="text" class="form-control" placeholder="Email" id="email" />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" placeholder="Password" id="password" />
        </div>
        <div class="mb-3">
          <label for="address" class="form-label">Address</label>
          <input type="text" class="form-control-lg" placeholder="Address" id="address" />
        </div>
        <div class="mb-3">
            <select class="form-select" id="select">
                <option selected>Choose your city</option>
                <option value="1">Ahmedabad</option>
                <option value="2">Surat</option>
                <option value="3">Vadodara</option>
            </select>
        </div>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- This was done to add the bootstrap java script file -->
  </body>
</html>
