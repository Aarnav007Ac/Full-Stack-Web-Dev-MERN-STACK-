<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Group</title>
    <!-- Now we have to link Bootstrap CSS File  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="Bootstrap_ButtonGroup.css">
</head>
<body>
    <div class="container">
        <h2>Bootstrap Buttons</h2>
        <div class="btn btn-primary">Home</div>
        <div class="btn btn-primary">Features</div>
        <div class="btn btn-primary">About</div>

        <!-- And now let's group them together -->
        <div class="btn-group">
            <div class="btn btn-primary">Home</div>
            <div class="btn btn-outline-warning">Features</div>
            <div class="btn btn-success">About</div>
        </div>
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <!-- This was done to add the bootstrap java script file -->
</body>
</html>
